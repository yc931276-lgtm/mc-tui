<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grass-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8c32"/>
      <stop offset="100%" stop-color="#4d7c2a"/>
    </linearGradient>
    <linearGradient id="dirt-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#866043"/>
      <stop offset="100%" stop-color="#5a3d28"/>
    </linearGradient>
    <linearGradient id="dirt-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e4e37"/>
      <stop offset="100%" stop-color="#483120"/>
    </linearGradient>
  </defs>
  <!-- Top Face -->
  <polygon points="64,14 114,42 64,70 14,42" fill="url(#grass-top)" stroke="#3e6020" stroke-width="2"/>
  <!-- Left Face -->
  <polygon points="14,42 64,70 64,116 14,88" fill="url(#dirt-left)" stroke="#3f2b1c" stroke-width="2"/>
  <!-- Right Face -->
  <polygon points="64,70 114,42 114,88 64,116" fill="url(#dirt-right)" stroke="#3f2b1c" stroke-width="2"/>
  <!-- Grass drip on left face -->
  <polygon points="14,42 64,70 64,78 52,75 42,81 32,74 22,79 14,72" fill="#4d7c2a"/>
  <!-- Grass drip on right face -->
  <polygon points="64,70 114,42 114,72 104,78 94,73 84,80 74,75 64,78" fill="#436b24"/>
  <!-- Terminal badge -->
  <rect x="36" y="44" width="56" height="38" rx="6" fill="#181824" stroke="#50fa7b" stroke-width="3" opacity="0.95"/>
  <text x="44" y="68" font-family="monospace" font-size="20" font-weight="bold" fill="#50fa7b">&gt;_</text>
</svg>
